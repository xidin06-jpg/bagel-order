<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>辦公室貝果團購</title>

<style>
:root{
  --bg:#fffaf4;
  --card:#ffffff;
  --brown:#5d4037;
  --orange:#e98b4b;
  --orange2:#fff0df;
  --text:#2e2926;
  --muted:#8d827b;
  --green:#4f8b62;
  --red:#d75b5b;
  --border:#eee3d9;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    sans-serif;

  background:var(--bg);
  color:var(--text);
}

/* =========================
   Header
========================= */

header{
  background:
    linear-gradient(
      135deg,
      #6b4638,
      #9d694f
    );

  color:white;
  padding:26px 20px;
}

.header-inner{
  max-width:1000px;
  margin:auto;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:15px;
}

h1{
  margin:0;
  font-size:26px;
}

.subtitle{
  opacity:.88;
  margin-top:7px;
  font-size:14px;
  white-space:pre-line;
}

/* =========================
   Layout
========================= */

.container{
  max-width:1000px;
  margin:22px auto;
  padding:0 16px 60px;
}

.card{
  background:var(--card);

  border:
    1px solid var(--border);

  box-shadow:
    0 5px 20px
    rgba(78,50,35,.06);

  border-radius:18px;

  padding:20px;
  margin-bottom:18px;
}

h2{
  font-size:18px;
  margin:0 0 16px;
}

input,
button,
textarea{
  font:inherit;
}

/* =========================
   Input
========================= */

.text-input{
  width:100%;

  padding:13px 14px;

  border:
    1px solid #ded3ca;

  border-radius:11px;

  outline:none;

  background:white;
}

.text-input:focus{
  border-color:var(--orange);

  box-shadow:
    0 0 0 3px
    rgba(233,139,75,.12);
}

textarea.text-input{
  resize:vertical;
  min-height:100px;
}

/* =========================
   Statistics
========================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;
}

.stat{
  background:#fff8ef;

  border:
    1px solid #f3dfca;

  border-radius:14px;

  padding:18px 12px;

  text-align:center;
}

.stat-value{
  font-size:25px;
  font-weight:800;

  color:var(--brown);

  margin-bottom:5px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

/* =========================
   Products
========================= */

.items{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.item{
  border:
    1px solid var(--border);

  border-radius:14px;

  padding:14px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:10px;
}

.item-name{
  font-weight:650;
}

.price{
  color:var(--muted);

  font-size:14px;

  margin-top:3px;
}

.stepper{
  display:flex;
  align-items:center;

  gap:9px;

  flex-shrink:0;
}

.stepper button{
  width:34px;
  height:34px;

  border-radius:50%;

  border:0;

  background:var(--orange2);
  color:#9d5f2f;

  font-size:20px;

  cursor:pointer;
}

.qty{
  min-width:18px;

  text-align:center;

  font-weight:700;
}

/* =========================
   Cart
========================= */

.summary-row{
  display:flex;
  justify-content:space-between;

  gap:15px;

  padding:8px 0;

  border-bottom:
    1px dashed #eee4dc;
}

.total{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-top:15px;

  font-size:18px;
  font-weight:800;
}

/* =========================
   Buttons
========================= */

.primary{
  border:0;

  background:var(--orange);
  color:white;

  padding:13px 18px;

  border-radius:11px;

  cursor:pointer;

  font-weight:700;
}

.secondary{
  border:
    1px solid var(--border);

  background:white;
  color:var(--brown);

  padding:11px 15px;

  border-radius:11px;

  cursor:pointer;
}

.danger{
  border:0;

  background:#fff0f0;
  color:var(--red);

  border-radius:9px;

  padding:8px 10px;

  cursor:pointer;
}

.actions{
  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-top:14px;
}

/* =========================
   Notice
========================= */

.notice{
  background:#edf8f0;
  color:#39704a;

  border-radius:11px;

  padding:13px;

  margin-top:13px;

  display:none;
}

/* =========================
   Public order list
========================= */

.current-orders{
  display:none;

  margin-top:16px;
}

.order-card{
  border:
    1px solid var(--border);

  border-radius:12px;

  margin-bottom:9px;

  overflow:hidden;
}

.order-head{
  padding:13px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  cursor:pointer;

  gap:10px;

  background:#fffdf9;
}

.order-head-name{
  font-weight:700;
}

.order-detail{
  display:none;

  padding:0 13px 13px;

  color:#6f655f;

  font-size:14px;

  line-height:1.7;
}

/* =========================
   Lookup
========================= */

.lookup-result{
  margin-top:15px;
  display:none;
}

.lookup-choice{
  border:
    1px solid var(--border);

  border-radius:12px;

  padding:14px;

  margin-top:10px;

  background:#fffdf9;
}

/* =========================
   Admin
========================= */

.admin{
  display:none;
}

.admin-tabs{
  display:flex;

  gap:7px;

  overflow:auto;

  margin-bottom:15px;
}

.tab{
  white-space:nowrap;

  padding:9px 13px;

  border:
    1px solid var(--border);

  border-radius:999px;

  background:white;

  cursor:pointer;
}

.tab.active{
  background:var(--brown);
  color:white;
}

.admin-page{
  display:none;
}

.admin-page.active{
  display:block;
}

/* =========================
   Table
========================= */

table{
  border-collapse:collapse;

  width:100%;

  min-width:650px;
}

th,
td{
  border-bottom:
    1px solid var(--border);

  padding:11px 9px;

  text-align:left;

  font-size:14px;
}

th{
  color:#6e625a;
  background:#fffaf5;
}

.table-wrap{
  overflow:auto;
}

/* =========================
   Product editor
========================= */

.admin-item{
  display:grid;

  grid-template-columns:
    1fr 120px auto;

  gap:8px;

  margin-bottom:8px;
}

.admin-item input{
  padding:10px;

  border:
    1px solid #ded3ca;

  border-radius:9px;
}

/* =========================
   Admin login
========================= */

.admin-login{
  max-width:420px;

  margin:70px auto;
}

.status{
  display:inline-block;

  background:#e9f6ed;
  color:#39704a;

  border-radius:999px;

  padding:5px 10px;

  font-size:12px;
}

#adminBtn{
  background:
    rgba(255,255,255,.15);

  color:white;

  border-color:
    rgba(255,255,255,.3);
}

/* =========================
   Mobile
========================= */

@media(max-width:700px){

  .items{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .header-inner{
    align-items:flex-start;
  }

  h1{
    font-size:22px;
  }

  .admin-item{
    grid-template-columns:
      1fr 90px auto;
  }
}
.order-head-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.order-arrow{
  color:#9d694f;
  font-size:13px;
  width:16px;
  text-align:center;
}

.public-order-item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:7px 0;
  border-bottom:1px dashed #eee4dc;
}

.public-order-total{
  margin-top:10px;
  text-align:right;
  font-weight:700;
  color:#5d4037;
}
.summary-product-row{
  cursor:pointer;
}

.summary-product-row:hover{
  background:#fffaf5;
}

.summary-product-name{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:650;
}

.summary-arrow{
  display:inline-block;
  width:16px;
  color:#9d694f;
  font-size:12px;
}

.summary-detail-row{
  display:none;
}

.summary-detail-row td{
  background:#fffdf9;
  padding:0;
}

.summary-detail-box{
  padding:10px 18px 14px 42px;
}

.summary-person{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:7px 0;
  border-bottom:1px dashed #eee4dc;
}

.summary-person:last-child{
  border-bottom:0;
}

.summary-person-name{
  color:#5d4037;
  font-weight:600;
}

.summary-person-qty{
  font-weight:700;
  color:#9d694f;
}

.summary-empty{
  color:#8d827b;
  padding:4px 0;
}
</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="header-inner">

    <div>

      <h1 id="siteTitle">
        辦公室貝果團購
      </h1>

      <div
        class="subtitle"
        id="siteSubtitle">

        大家自己點，系統幫忙統計 ✨

      </div>

    </div>


    <button
      class="secondary"
      id="adminBtn"
      onclick="openAdmin()">

      團主後台

    </button>

  </div>

</header>



<!-- =========================
     SHOP PAGE
========================= -->

<main
  class="container"
  id="shopPage">


  <!-- 統計 -->
  <section class="card">

    <div class="stats">

      <div class="stat">

        <div
          class="stat-value"
          id="peopleCount">

          0

        </div>

        <div class="stat-label">

          已訂購人數

        </div>

      </div>


      <div class="stat">

        <div
          class="stat-value"
          id="bagelCount">

          0

        </div>

        <div class="stat-label">

          已訂購數量

        </div>

      </div>


      <div class="stat">

        <div
          class="stat-value"
          id="amountCount">

          $0

        </div>

        <div class="stat-label">

          目前累積金額

        </div>

      </div>

    </div>


    <div class="actions">

      <button
        class="secondary"
        onclick="toggleCurrentOrders()">

        📋 查看目前訂單

      </button>


      <button
        class="secondary"
        onclick="toggleLookup()">

        🔎 查詢／修改我的訂單

      </button>

    </div>


    <div
      class="current-orders"
      id="currentOrders">
    </div>

  </section>



  <!-- 查詢訂單 -->
  <section
    class="card"
    id="lookupBox"
    style="display:none">

    <h2>
      🔎 查詢／修改我的訂單
    </h2>

    <p
      style="
        color:#8d827b;
        font-size:14px;
      ">

      輸入你下單時使用的姓名。

    </p>


    <input
      class="text-input"
      id="lookupName"
      placeholder="請輸入你的姓名">


    <div class="actions">

      <button
        class="primary"
        onclick="lookupOrderByName()">

        查詢訂單

      </button>

    </div>


    <div
      class="lookup-result"
      id="lookupResult">
    </div>

  </section>



  <!-- 訂購人 -->
  <section class="card">

    <h2>
      👤 訂購人
    </h2>


    <input
      class="text-input"
      id="customerName"
      placeholder="請輸入你的姓名">

  </section>



  <!-- 選商品 -->
  <section class="card">

    <h2>
      選擇貝果
    </h2>


    <div
      class="items"
      id="items">
    </div>

  </section>



  <!-- 購物車 -->
  <section class="card">

    <h2>
      🛒 我的訂單
    </h2>


    <div id="cart"></div>


    <div class="total">

      <span>
        總計
      </span>

      <span id="total">
        $0
      </span>

    </div>


    <div class="actions">

      <button
        class="primary"
        id="submitBtn"
        onclick="submitOrder()">

        送出訂單

      </button>


      <button
        class="secondary"
        onclick="clearCart()">

        清空

      </button>

    </div>


    <div
      class="notice"
      id="success">
    </div>

  </section>

</main>



<!-- =========================
     ADMIN PAGE
========================= -->

<main
  class="container admin"
  id="adminPage">


  <!-- Login -->
  <div
    class="card admin-login"
    id="loginBox">

    <h2>
      🔐 團主登入
    </h2>


    <p
      style="
        color:#8d827b;
        font-size:14px;
      ">

      目前為測試版登入。
      正式接 Firebase 後會改成真正的帳號權限。

    </p>


    <input
      class="text-input"
      type="password"
      id="adminPassword"
      placeholder="輸入團主密碼">


    <div class="actions">

      <button
        class="primary"
        onclick="loginAdmin()">

        登入

      </button>


      <button
        class="secondary"
        onclick="closeAdmin()">

        返回團購

      </button>

    </div>

  </div>



  <!-- Admin Content -->
  <div
    id="adminContent"
    style="display:none">


    <section class="card">

      <div
        style="
          display:flex;
          justify-content:space-between;
          gap:10px;
          align-items:center;
        ">


        <div>

          <h2
            style="margin-bottom:5px">

            👑 團主後台

          </h2>


          <span class="status">

            團購進行中

          </span>

        </div>


        <button
          class="secondary"
          onclick="closeAdmin()">

          返回團購頁

        </button>

      </div>

    </section>



    <section class="card">


      <!-- Tabs -->
      <div class="admin-tabs">

        <button
          class="tab active"
          onclick="
            showTab(
              'summary',
              this
            )
          ">

          統計

        </button>


        <button
          class="tab"
          onclick="
            showTab(
              'orders',
              this
            )
          ">

          訂購明細

        </button>


        <button
          class="tab"
          onclick="
            showTab(
              'products',
              this
            )
          ">

          品項管理

        </button>


        <button
          class="tab"
          onclick="
            showTab(
              'settings',
              this
            )
          ">

          網站設定

        </button>

      </div>



      <!-- =====================
           SUMMARY
      ====================== -->

      <div
        class="admin-page active"
        id="summary">


        <h2>
          📊 品項統計
        </h2>


        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>
                  品項
                </th>

                <th>
                  數量
                </th>

                <th>
                  單價
                </th>

                <th>
                  小計
                </th>

              </tr>

            </thead>


            <tbody
              id="summaryBody">
            </tbody>

          </table>

        </div>


        <div class="total">

          <span>
            全部訂單總額
          </span>

          <span
            id="adminTotal">

            $0

          </span>

        </div>


        <div class="actions">

          <button
            class="primary"
            onclick="downloadCSV()">

            下載統計 CSV

          </button>


          <button
            class="secondary"
            onclick="copySummary()">

            複製文字統計

          </button>

        </div>

      </div>



      <!-- =====================
           ORDERS
      ====================== -->

      <div
        class="admin-page"
        id="orders">


        <h2>
          👥 所有人的訂單
        </h2>


        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>
                  內部編號
                </th>

                <th>
                  姓名
                </th>

                <th>
                  訂購內容
                </th>

                <th>
                  數量
                </th>

                <th>
                  金額
                </th>

                <th>
                  操作
                </th>

              </tr>

            </thead>


            <tbody
              id="ordersBody">
            </tbody>

          </table>

        </div>

      </div>



      <!-- =====================
           PRODUCTS
      ====================== -->

      <div
        class="admin-page"
        id="products">


        <h2>
          ⚙️ 品項管理
        </h2>


        <div
          id="productEditor">
        </div>


        <div class="actions">

          <button
            class="secondary"
            onclick="addProduct()">

            ＋ 新增品項

          </button>


          <button
            class="primary"
            onclick="saveProducts()">

            儲存品項

          </button>

        </div>

      </div>



      <!-- =====================
           SETTINGS
      ====================== -->

      <div
        class="admin-page"
        id="settings">


        <h2>
          ✏️ 網站設定
        </h2>


        <p
          style="
            color:#8d827b;
            font-size:14px;
          ">

          修改後首頁會立即套用。

        </p>


        <label>
          首頁標題
        </label>


        <input
          class="text-input"
          id="settingTitle"
          style="
            margin-top:8px;
            margin-bottom:18px;
          ">


        <label>
          首頁內文
        </label>


        <textarea
          class="text-input"
          id="settingSubtitle"
          style="
            margin-top:8px;
            margin-bottom:18px;
          ">
        </textarea>


        <label>
          姓名欄位提示文字
        </label>


        <input
          class="text-input"
          id="settingNamePlaceholder"
          style="
            margin-top:8px;
            margin-bottom:18px;
          ">


        <div class="actions">

          <button
            class="primary"
            onclick="saveSettings()">

            儲存網站設定

          </button>

        </div>

      </div>

    </section>

  </div>

</main>



<script>
/* ======================================================
   DEFAULT PRODUCTS
====================================================== */
const defaultProducts = [
  ["原味貝果",40],
  ["蜂蜜貝果",40],
  ["芝麻核桃乳酪",50],
  ["香芋貝果",50],
  ["抹茶紅豆",50],
  ["紫薯地瓜",50],
  ["草莓乳酪",50],
  ["胡椒double起司",50],
  ["香檸貝果",50],
  ["肉桂蘋果",50],
  ["芝麻花生乳酪",50],
  ["熔岩巧克力",50],
  ["oreo巧克力",50],
  ["藍莓乳酪",50],
  ["咖啡貝果",50],
  ["紅豆麻吉貝果",60],
  ["珍珠奶茶貝果",65],
  ["川味洋腸",70],
  ["剝皮辣椒起司",70],
  ["松露牛肝菌野菇起司貝果",75],
  ["冰心覆盆子可可貝果",60],
  ["冰心藍莓優格",60]
].map(
  (x,i)=>({
    id:"p"+i,
    name:x[0],
    price:x[1]
  })
);

/* ======================================================
   DATA
====================================================== */
let products =
  structuredClone(
    defaultProducts
  );

let orders = [];

let settings = {
  title:
    "辦公室貝果團購",
  subtitle:
    "大家自己點，系統幫忙統計 ✨",
  namePlaceholder:
    "請輸入你的姓名"
};

Object.defineProperties(
  window,
  {
    products:{
      get:()=>products,
      set:v=>products=v
    },
    orders:{
      get:()=>orders,
      set:v=>orders=v
    },
    settings:{
      get:()=>settings,
      set:v=>settings=v
    }
  }
);

let cart = {};
let editingOrderId = null;

/* ======================================================
   HELPERS
====================================================== */
function money(n){
  return "$" +
    Number(n)
    .toLocaleString("zh-TW");
}

function escapeHTML(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(str){
  return escapeHTML(str);
}

function firebaseNotReady(){
  alert(
    "資料庫正在連線，請稍等一下再試。"
  );
}

/* ======================================================
   SETTINGS
====================================================== */
function applySettings(){
  document.getElementById(
    "siteTitle"
  ).textContent =
    settings.title;

  document.getElementById(
    "siteSubtitle"
  ).textContent =
    settings.subtitle;

  const placeholder =
    settings.namePlaceholder
    || "請輸入你的姓名";

  document.getElementById(
    "customerName"
  ).placeholder =
    placeholder;

  document.getElementById(
    "lookupName"
  ).placeholder =
    placeholder;

  document.title =
    settings.title;
}

/* ======================================================
   PRODUCTS
====================================================== */
function renderProducts(){
  const el =
    document.getElementById(
      "items"
    );

  el.innerHTML =
    products.map(p=>`
      <div class="item">
        <div>
          <div class="item-name">
            ${escapeHTML(p.name)}
          </div>

          <div class="price">
            ${money(p.price)}
          </div>
        </div>

        <div class="stepper">
          <button
            onclick="
              changeQty(
                '${p.id}',
                -1
              )
            ">
            −
          </button>

          <span class="qty">
            ${cart[p.id] || 0}
          </span>

          <button
            onclick="
              changeQty(
                '${p.id}',
                1
              )
            ">
            ＋
          </button>
        </div>
      </div>
    `)
    .join("");
}

function changeQty(
  id,
  delta
){
  cart[id] =
    Math.max(
      0,
      (cart[id] || 0)
      + delta
    );

  if(cart[id] === 0){
    delete cart[id];
  }

  renderProducts();
  renderCart();
}

/* ======================================================
   CART
====================================================== */
function renderCart(){
  const rows =
    products
    .filter(
      p=>cart[p.id]
    )
    .map(p=>`
      <div class="summary-row">
        <span>
          ${escapeHTML(p.name)}
          ×
          ${cart[p.id]}
        </span>

        <strong>
          ${
            money(
              p.price
              *
              cart[p.id]
            )
          }
        </strong>
      </div>
    `);

  document.getElementById(
    "cart"
  ).innerHTML =
    rows.length
    ? rows.join("")
    : `
      <div style="color:#8d827b">
        還沒有選擇品項
      </div>
    `;

  const total =
    products.reduce(
      (sum,p)=>
        sum
        +
        (cart[p.id] || 0)
        *
        p.price,
      0
    );

  document.getElementById(
    "total"
  ).textContent =
    money(total);
}

function clearCart(){

  editingOrderId = null;

  document.getElementById(
    "submitBtn"

  renderCart();

/* ======================================================
   SUBMIT ORDER
====================================================== */
async function submitOrder(){

  const name =
    document.getElementById(
      "customerName"
    )
    .value
    .trim();

  if(!name){
    alert("請先輸入姓名");
    return;
  }

  if(
    Object.keys(cart)
    .length === 0
  ){
    alert(
      "請至少選擇一個品項"
    );
    return;
  }

  const items =
    Object.entries(cart)
    .map(
      ([productId,qty])=>({
        productId,
        qty
      })
    );

  const submitBtn =
    document.getElementById(
      "submitBtn"
    );

  submitBtn.disabled = true;

  try{

    /* ======================
       UPDATE
    ====================== */
    if(editingOrderId){

      if(
        !window.firebaseUpdateOrder
      ){
        firebaseNotReady();
        return;
      }

      const oldOrder =
        orders.find(
          o=>
            o.id ===
            editingOrderId
        );

      if(!oldOrder){
        alert(
          "找不到原本訂單"
        );
        return;
      }

      const updatedOrder = {
        ...oldOrder,
        name,
        items,
        updatedAt:
          new Date()
          .toISOString()
      };

      await window
        .firebaseUpdateOrder(
          updatedOrder
        );

      document.getElementById(
        "success"
      ).innerHTML =
        "訂單已更新 ✅";

      document.getElementById(
        "success"
      ).style.display =
        "block";

      setTimeout(
        ()=>{
          document.getElementById(
            "success"
          ).style.display =
            "none";
        },
        2500
      );

      editingOrderId = null;
      cart = {};

      document.getElementById(
        "customerName"
      ).value = "";

      submitBtn.textContent =
        "送出訂單";

      renderProducts();
      renderCart();

      return;
    }

    /* ======================
       NEW ORDER
    ====================== */

    if(
      !window.firebaseCreateOrder
    ){
      firebaseNotReady();
      return;
    }

    const order = {
      id:
        "o-" +
        crypto.randomUUID(),
      name,
      items,
      createdAt:
        new Date()
        .toISOString()
    };

    await window
      .firebaseCreateOrder(
        order
      );

    document.getElementById(
      "success"
    ).innerHTML =
      `訂單已成功送出 ✅<br>
       之後可直接使用姓名查詢或修改。`;

    document.getElementById(
      "success"
    ).style.display =
      "block";

    setTimeout(
      ()=>{
        document.getElementById(
          "success"
        ).style.display =
          "none";
      },
      4000
    );

    cart = {};

    document.getElementById(
      "customerName"
    ).value = "";

    renderProducts();
    renderCart();

  }catch(error){

    console.error(
      "訂單寫入失敗：",
      error
    );

    alert(
      "訂單送出失敗，請檢查網路後再試一次。"
    );

  }finally{

    submitBtn.disabled = false;

    submitBtn.textContent =
      editingOrderId
      ? "儲存修改"
      : "送出訂單";
  }
}

/* ======================================================
   ORDER TOTAL / COUNT
====================================================== */
function orderTotal(order){
  return order.items.reduce(
    (sum,i)=>{

      const p =
        products.find(
          x=>
            x.id ===
            i.productId
        );

      return sum +
        (
          p
          ? p.price * i.qty
          : 0
        );

    },
    0
  );
}

function orderCount(order){
  return order.items.reduce(
    (sum,i)=>
      sum + i.qty,
    0
  );
}

/* ======================================================
   PRODUCT TOTALS
====================================================== */
function getProductQty(){

  const result = {};

  products.forEach(
    p=>
      result[p.id] = 0
  );

  orders.forEach(order=>{

    order.items.forEach(i=>{

      result[i.productId] =
        (
          result[i.productId]
          || 0
        )
        +
        i.qty;

    });

  });

  return result;
}

/* ======================================================
   SUMMARY
====================================================== */
function renderSummary(){

  const qty =
    getProductQty();

  let total = 0;

  document.getElementById(
    "summaryBody"
  ).innerHTML =
    products.map(p=>{

      const count =
        qty[p.id] || 0;

      const subtotal =
        count * p.price;

      total += subtotal;

      const peopleMap = {};

      orders.forEach(order=>{

        order.items.forEach(item=>{

          if(
            item.productId === p.id
            &&
            item.qty > 0
          ){

            const name =
              order.name.trim()
              || "未命名";

            if(!peopleMap[name]){
              peopleMap[name] = 0;
            }

            peopleMap[name] +=
              item.qty;
          }

        });

      });

      const people =
        Object.entries(
          peopleMap
        );

      let detailHTML = "";

      if(people.length === 0){

        detailHTML = `
          <div class="summary-empty">
            目前沒有人訂這個品項
          </div>
        `;

      }else{

        detailHTML =
          people.map(
            ([name,personQty])=>`
              <div class="summary-person">

                <span class="summary-person-name">
                  ${escapeHTML(name)}
                </span>

                <span class="summary-person-qty">
                  × ${personQty}
                </span>

              </div>
            `
          )
          .join("");
      }

      return `
        <tr
          class="summary-product-row"
          onclick="
            toggleSummaryDetail(
              '${p.id}'
            )
          "
        >

          <td>
            <div class="summary-product-name">

              <span
                class="summary-arrow"
                id="summary-arrow-${p.id}"
              >
                ▶
              </span>

              <span>
                ${escapeHTML(p.name)}
              </span>

            </div>
          </td>

          <td>
            ${count}
          </td>

          <td>
            ${money(p.price)}
          </td>

          <td>
            ${money(subtotal)}
          </td>

        </tr>

        <tr
          class="summary-detail-row"
          id="summary-detail-${p.id}"
        >

          <td colspan="4">
            <div class="summary-detail-box">
              ${detailHTML}
            </div>
          </td>

        </tr>
      `;

    })
    .join("");

  document.getElementById(
    "adminTotal"
  ).textContent =
    money(total);
}

    rows.push([
      p.name,
      count,
      p.price,
      count * p.price
    ]);
  });

  rows.push([]);

  rows.push([
    "內部訂單編號",
    "姓名",
    "訂購內容",
    "數量",
    "金額"
  ]);

  orders.forEach(order=>{

    const content =
      order.items.map(i=>{

        const p =
          products.find(
            x=>
              x.id ===
              i.productId
          );

        return p
          ? `${p.name} x${i.qty}`
          : "";

      })
      .join(" / ");

    rows.push([
      order.orderNumber || "",
      order.name,
      content,
      orderCount(order),
      orderTotal(order)
    ]);
  });

  const csv =
    "\uFEFF"
    +
    rows.map(row=>
      row.map(cell=>{

        const s =
          String(
            cell ?? ""
          )
          .replace(
            /"/g,
            '""'
          );

        return `"${s}"`;

      })
      .join(",")
    )
    .join("\n");

  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  a.href = url;

  a.download =
    "貝果團購統計.csv";

  a.click();

  URL.revokeObjectURL(url);
}

/* ======================================================
   COPY SUMMARY
====================================================== */
async function copySummary(){

  const qty =
    getProductQty();

  let text =
    `【${settings.title}統計】\n\n`;

  products.forEach(p=>{

    const count =
      qty[p.id] || 0;

    if(count > 0){
      text +=
        `${p.name} × ${count}\n`;
    }
  });

  const total =
    orders.reduce(
      (sum,o)=>
        sum +
        orderTotal(o),
      0
    );

  const bagels =
    orders.reduce(
      (sum,o)=>
        sum +
        orderCount(o),
      0
    );

  text +=
    `\n共 ${orders.length} 人`;

  text +=
    `\n共 ${bagels} 個`;

  text +=
    `\n總金額 ${money(total)}`;

  try{

    await navigator
      .clipboard
      .writeText(text);

    alert(
      "統計內容已複製"
    );

  }catch{

    prompt(
      "請複製以下內容：",
      text
    );
  }
}

/* ======================================================
   REFRESH
====================================================== */
function refreshEverything(){

  renderProducts();
  renderCart();
  renderStats();

  const currentOrders =
    document.getElementById(
      "currentOrders"
    );

  if(
    currentOrders.style.display
    === "block"
  ){
    renderCurrentOrders();
  }
}

/* ======================================================
   START
====================================================== */
applySettings();
refreshEverything();

/* 給 Firebase module 使用 */
window.applySettings =
  applySettings;

window.refreshEverything =
  refreshEverything;

window.refreshAdmin =
  refreshAdmin;

</script>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  deleteDoc,
  getDoc,
  getDocs,
  onSnapshot,
  runTransaction
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey:
    "AIzaSyDu9r1nAecVvfpK2EElHRR31vcifVawnUw",
  authDomain:
    "bagel-order-ffae5.firebaseapp.com",
  projectId:
    "bagel-order-ffae5",
  storageBucket:
    "bagel-order-ffae5.firebasestorage.app",
  messagingSenderId:
    "372719633498",
  appId:
    "1:372719633498:web:46b268c66336e4173f4463"
};


const firebaseApp =
  initializeApp(
    firebaseConfig
  );

const db =
  getFirestore(
    firebaseApp
  );


/* ======================================================
   FIRESTORE REFERENCES
====================================================== */

const ordersCollection =
  collection(
    db,
    "orders"
  );

const configDoc =
  doc(
    db,
    "config",
    "shared"
  );

const counterDoc =
  doc(
    db,
    "meta",
    "orderCounter"
  );

/*
  舊版本資料的位置。
  用來自動搬移舊資料。
*/
const legacySharedDoc =
  doc(
    db,
    "bagel",
    "shared"
  );


/* ======================================================
   CREATE ORDER
====================================================== */

window.firebaseCreateOrder =
  async function(order){

    let createdOrder = null;

    await runTransaction(
      db,
      async transaction => {

        const counterSnapshot =
          await transaction.get(
            counterDoc
          );

        let next = 1;

        if(
          counterSnapshot.exists()
        ){
          next =
            Number(
              counterSnapshot
                .data()
                .value
              || 0
            )
            + 1;
        }

        const orderNumber =
          String(next)
          .padStart(
            2,
            "0"
          );

        createdOrder = {
          ...order,
          orderNumber
        };

        transaction.set(
          counterDoc,
          {
            value:next
          },
          {
            merge:true
          }
        );

        transaction.set(
          doc(
            db,
            "orders",
            order.id
          ),
          createdOrder
        );
      }
    );

    return createdOrder;
  };


/* ======================================================
   UPDATE ORDER
====================================================== */

window.firebaseUpdateOrder =
  async function(order){

    await setDoc(
      doc(
        db,
        "orders",
        order.id
      ),
      order
    );
  };


/* ======================================================
   DELETE ORDER
====================================================== */

window.firebaseDeleteOrder =
  async function(id){

    await deleteDoc(
      doc(
        db,
        "orders",
        id
      )
    );
  };


/* ======================================================
   SAVE PRODUCTS + SETTINGS
====================================================== */

window.firebaseSaveConfig =
  async function(data){

    await setDoc(
      configDoc,
      {
        products:
          data.products,
        settings:
          data.settings
      },
      {
        merge:true
      }
    );
  };


/* ======================================================
   MIGRATE OLD bagel/shared DATA
====================================================== */

async function migrateLegacyData(){

  const currentOrders =
    await getDocs(
      ordersCollection
    );

  const configSnapshot =
    await getDoc(
      configDoc
    );

  /*
    orders collection 已經有資料
    就不再搬舊資料
  */
  if(!currentOrders.empty){
    return;
  }

  const legacySnapshot =
    await getDoc(
      legacySharedDoc
    );

  if(
    !legacySnapshot.exists()
  ){
    return;
  }

  const legacy =
    legacySnapshot.data();

  /*
    搬舊訂單
  */
  if(
    Array.isArray(
      legacy.orders
    )
    &&
    legacy.orders.length > 0
  ){

    let biggestNumber = 0;

    for(
      const oldOrder
      of legacy.orders
    ){

      const id =
        oldOrder.id
        ||
        (
          "o-" +
          crypto.randomUUID()
        );

      const number =
        parseInt(
          oldOrder.orderNumber
        );

      if(
        !Number.isNaN(number)
      ){
        biggestNumber =
          Math.max(
            biggestNumber,
            number
          );
      }

      await setDoc(
        doc(
          db,
          "orders",
          id
        ),
        {
          ...oldOrder,
          id
        }
      );
    }

    if(biggestNumber > 0){

      await setDoc(
        counterDoc,
        {
          value:
            biggestNumber
        },
        {
          merge:true
        }
      );
    }
  }

  /*
    搬舊商品與網站設定
  */
  if(
    !configSnapshot.exists()
  ){

    const configData = {};

    if(
      Array.isArray(
        legacy.products
      )
    ){
      configData.products =
        legacy.products;
    }

    if(
      legacy.settings
    ){
      configData.settings =
        legacy.settings;
    }

    if(
      Object.keys(
        configData
      ).length > 0
    ){
      await setDoc(
        configDoc,
        configData
      );
    }
  }
}


/* ======================================================
   INITIAL CONFIG
====================================================== */

async function ensureConfig(){

  const snapshot =
    await getDoc(
      configDoc
    );

  if(snapshot.exists()){
    return;
  }

  await setDoc(
    configDoc,
    {
      products:
        window.products,
      settings:
        window.settings
    }
  );
}


/* ======================================================
   REALTIME CONFIG
====================================================== */

function listenConfig(){

  onSnapshot(
    configDoc,
    snapshot => {

      if(
        !snapshot.exists()
      ){
        return;
      }

      const data =
        snapshot.data();

      if(
        Array.isArray(
          data.products
        )
      ){
        window.products =
          data.products;
      }

      if(
        data.settings
      ){
        window.settings =
          data.settings;
      }

      window.applySettings();
      window.refreshEverything();

      const adminContent =
        document.getElementById(
          "adminContent"
        );

      if(
        adminContent
        &&
        adminContent.style.display
        === "block"
      ){
        window.refreshAdmin();
      }
    },
    error => {

      console.error(
        "網站設定同步失敗：",
        error
      );
    }
  );
}


/* ======================================================
   REALTIME ORDERS
====================================================== */

function listenOrders(){

  onSnapshot(
    ordersCollection,
    snapshot => {

      const newOrders =
        snapshot.docs
        .map(
          d=>({
            ...d.data(),
            id:
              d.data().id
              ||
              d.id
          })
        )
        .sort(
          (a,b)=>
            new Date(
              a.createdAt || 0
            )
            -
            new Date(
              b.createdAt || 0
            )
        );

      window.orders =
        newOrders;

      window.refreshEverything();

      const lookupResult =
        document.getElementById(
          "lookupResult"
        );

      /*
        查詢結果如果正在顯示，
        不強制清除。
      */

      const adminContent =
        document.getElementById(
          "adminContent"
        );

      if(
        adminContent
        &&
        adminContent.style.display
        === "block"
      ){
        window.refreshAdmin();
      }
    },
    error => {

      console.error(
        "訂單同步失敗：",
        error
      );

      alert(
        "無法連線到訂單資料庫，請重新整理頁面。"
      );
    }
  );
}


/* ======================================================
   START FIREBASE
====================================================== */

async function startFirebase(){

  try{

    /*
      先搬你目前舊版 bagel/shared
      裡可能已經存在的資料
    */
    await migrateLegacyData();

    /*
      沒有設定資料時建立預設設定
    */
    await ensureConfig();

    /*
      開始即時監聽
    */
    listenConfig();
    listenOrders();

    console.log(
      "Firebase 多人即時同步已啟用"
    );

  }catch(error){

    console.error(
      "Firebase 初始化失敗：",
      error
    );

    alert(
      "Firebase 連線失敗，請確認 Firestore 已建立並檢查 Rules。"
    );
  }
}

startFirebase();
